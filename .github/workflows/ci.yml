name: CI
# Build + the real end-to-end sync test. No signing here — releases run locally via release.sh.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build -c release
      - name: Git identity for test harness
        run: |
          git config --global user.name ci
          git config --global user.email ci@gitpad.test
      - name: Sync end-to-end tests
        run: ./test_gitsync.sh
